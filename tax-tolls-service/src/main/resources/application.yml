server:
  port: 8090

spring:
  config:
    import: "optional:classpath:uberlite-defaults.yml"
  application:
    name: tax-tolls-service

  datasource:
    # localhost is the default so the module is runnable standalone
    # (`mvn -pl tax-tolls-service spring-boot:run`); the docker profile below swaps in the Compose
    # hostname. Previously this was hardcoded to the Compose hostname with no docker profile at all.
    url: jdbc:postgresql://localhost:5434/taxtollsdb
    username: uberlite
    password: changeme
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

# Readiness gates traffic on the datastore this service cannot serve without. Only `readinessState`
# is in common's uberlite-defaults.yml: Actuator refuses to start when a health group names a
# contributor that does not exist, so the datastore member is declared by the module that has one.
management:
  endpoint:
    health:
      group:
        readiness:
          include:
            - readinessState
            - db

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://tax-tolls-postgres:5432/taxtollsdb
