spring:
  config:
    import: "optional:classpath:uberlite-defaults.yml"
  application:
    name: matching-service
  cloud:
    openfeign:
      client:
        config:
          # Matching sits on the rider-facing critical path and fans out one route-service call per
          # candidate: fail fast rather than hold the request thread on a sick dependency.
          default:
            connectTimeout: 2000
            readTimeout: 3000
            loggerLevel: basic

# Greedy nearest-available-driver matching (ARCHITECTURE.md Sec. 2, "MS"; paper Sec. 4.1).
matching:
  radius-meters: 3000       # search radius passed to driver-discovery-service
  candidate-limit: 10       # max candidates ranked; bounds route-service fan-out
  # Local straight-line ETA for *ranking only* — 8.33 m/s == 30 km/h urban average. The rider-facing
  # ETA is time-estimation-service's job; ranking only needs a distance-monotonic score.
  average-speed-mps: 8.33
  # Route Service only returns a detourFactor when given an observed distance, which we don't have
  # at match time. Straight-line -> road-distance correction applied instead.
  default-detour-factor: 1.3

server:
  port: 8089
