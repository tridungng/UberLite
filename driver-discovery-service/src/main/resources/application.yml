server:
  port: 8086
spring:
  config:
    import: "optional:classpath:uberlite-defaults.yml"
  application:
    # Must match @FeignClient(name = "driver-discovery-service") in matching-service and
    # surge-pricing-service. Previously absent, so the service registered with Eureka as UNKNOWN
    # and neither caller could resolve it.
    name: driver-discovery-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Readiness gates traffic on the datastore this service cannot serve without. Only `readinessState`
# is in common's uberlite-defaults.yml: Actuator refuses to start when a health group names a
# contributor that does not exist, so the datastore member is declared by the module that has one.
management:
  endpoint:
    health:
      group:
        readiness:
          include:
            - readinessState
            - db

---
spring:
  config:
    activate:
      on-profile: docker
  data:
    redis:
      host: redis
