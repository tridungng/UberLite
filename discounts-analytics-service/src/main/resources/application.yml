server:
  port: 8094

spring:
  application:
    name: discounts-analytics-service
  datasource:
    url: jdbc:postgresql://localhost:5438/discountsanalyticsdb
    username: uberlite
    password: changeme
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            # Generous compared to the rider-facing services: this is a background batch pulling an
            # aggregate over every rider, and nobody is waiting on the response.
            readTimeout: 30000
            loggerLevel: basic

discounts-analytics:
  # "<3 completed trips", matching the first-3-rides promotion Discounts & Promotions seeds.
  trip-threshold: 3
  # 02:00 daily — after the evening peak has settled, before the morning one starts.
  cron: "0 0 2 * * *"

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://discounts-analytics-postgres:5432/discountsanalyticsdb

eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true
