server:
  port: 8093

spring:
  application:
    name: matching-analytics-service
  datasource:
    url: jdbc:postgresql://localhost:5437/matchinganalyticsdb
    username: uberlite
    password: changeme
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: matching-analytics-service
      # The log is meant to be complete; starting at the latest offset would silently lose every
      # match that happened while this service was down.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        # Trip Service publishes with noTypeInfo(), so there is no __TypeId__ header to read and
        # the target type has to be named here instead. Without the pair of these the payload
        # silently deserialises to a Map and the listener signature stops matching.
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.uberlite.common.events.TripEvent
        # Narrower than "*": only the shared event package is trusted.
        spring.json.trusted.packages: com.uberlite.common.events

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://matching-analytics-postgres:5432/matchinganalyticsdb
  kafka:
    bootstrap-servers: kafka:9092

eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true
