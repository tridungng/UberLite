spring:
  application:
    name: api-gateway
server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# docker profile - point at the discovery-server service in compose
---
spring:
  config:
    activate:
      on-profile: docker
  application:
    name: api-gateway
eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/

