# UberLite - local stack.
#
# Two rules make this file work the way it does, and both exist so that a single service can be
# deployed, restarted and debugged on its own:
#
#  1. NO application service declares `depends_on` on another application service. Boot order
#     between services is not something you can configure your way out of - in production the pods
#     start in whatever order the scheduler picks, so a service that cannot boot without its peers
#     is broken there too. Services find each other through Eureka at *call* time and fail fast
#     (see the Feign timeouts in each application.yml) when a peer is missing. The payoff: the whole
#     stack boots in parallel, and when something breaks the red container IS the broken one,
#     instead of nine services blocked behind it and Compose naming the wrong cause.
#  2. Every `depends_on` is `service_started`, never `service_healthy`. Health gates are not
#     portable: Podman does not execute Compose-declared health checks, so a `service_healthy`
#     dependency never opens there and the dependent service is never started at all - which is
#     exactly how six services once came up missing rather than broken.
#
#     The Kafka and Eureka clients reconnect on their own, so they need no gate. A database is the
#     one real startup dependency (Hibernate validates the schema during context refresh), and that
#     is handled by `restart: unless-stopped`: the container exits, is restarted, and succeeds once
#     Postgres accepts connections - usually one retry. Crash-until-the-dependency-is-ready is the
#     same contract Kubernetes runs on, and it behaves identically on every runtime.
#
#     The Postgres `healthcheck:` blocks below are kept: they are still what `docker compose up
#     --wait` and the STATUS column read.
#
# Profiles keep the "just this service" workflow cheap:
#
#     docker compose up -d                          # platform only: Eureka, gateway, Kafka, Redis,
#                                                   #   Zipkin and the six databases
#     docker compose up -d trip-service             # ... plus one service and its database
#     docker compose up -d --no-deps --build trip-service   # rebuild one service, touch nothing else
#     docker compose --profile core up -d           # the marketplace services
#     docker compose --profile all up --build       # everything (what scripts/demo.sh expects)
#
# The `version:` key is intentionally absent: it is obsolete in Compose v2 and only emits a warning.

# -------------------------------------------------------------------------------------------------
# Shared fragments. Every application service inherits the same env and lifecycle policy, so adding
# a service is six lines rather than twenty.
# -------------------------------------------------------------------------------------------------
x-service-env: &service-env
  SPRING_PROFILES_ACTIVE: docker
  EUREKA_URL: http://discovery-server:8761/eureka/
  ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
  # JVM sizing lives in the image (JDK_JAVA_OPTIONS in the Dockerfile) so it applies wherever the
  # image runs, not only under Compose. Override it here per environment if you need to.

x-app-service: &app-service
  restart: unless-stopped
  environment: *service-env
  networks: [ uberlite ]
  # Longer than Docker's 10s default so Boot's graceful shutdown can drain in-flight requests and
  # deregister from Eureka instead of being SIGKILLed mid-request.
  stop_grace_period: 30s
  # Unbounded json-file logs are the classic way a dev machine runs out of disk overnight.
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-postgres: &postgres
  image: postgres:15
  restart: unless-stopped
  networks: [ uberlite ]
  environment: &postgres-env
    POSTGRES_USER: uberlite
    POSTGRES_PASSWORD: changeme

# The platform every service talks to. Deliberately `service_started`, not `service_healthy`: the
# Eureka client retries registration in the background and the tracer buffers spans, so neither is
# required for a healthy boot - making them a hard gate only serialises startup for no benefit.
x-platform: &platform
  discovery-server:
    condition: service_started
  zipkin:
    condition: service_started

# Everything that produces or consumes domain events. The broker is not needed to *boot*
# (missing-topics-fatal is off and the producer retries), only to do useful work.
x-platform-with-kafka: &platform-with-kafka
  discovery-server:
    condition: service_started
  zipkin:
    condition: service_started
  kafka:
    condition: service_started

services:
  # -----------------------------------------------------------------------------------------------
  # Infrastructure and platform. No profile, so a bare `docker compose up -d` gives you a usable
  # platform and nothing else - the fast inner loop when you are working on one service.
  # -----------------------------------------------------------------------------------------------
  zipkin:
    image: openzipkin/zipkin:3
    restart: unless-stopped
    networks: [ uberlite ]
    ports:
      - "9411:9411"
    environment:
      # In-memory storage: traces are for looking at during a demo, not for keeping.
      STORAGE_TYPE: mem
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9411/health" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # No ZooKeeper service: Confluent Platform 8.x is built on Apache Kafka 4.x, which removed
  # ZooKeeper entirely, so confluentinc/cp-zookeeper has no 8.x tag to pull. The broker below runs
  # as a single-node KRaft cluster acting as its own controller quorum.
  kafka:
    image: confluentinc/cp-kafka:8.2.2
    restart: unless-stopped
    networks: [ uberlite ]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      # Fixed rather than generated: the id is baked into the formatted log directory, and a fresh
      # one on every `up` would make the broker refuse to start against a surviving volume.
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      # Two client listeners: containers reach the broker as kafka:9092, the host as
      # localhost:29092. With a single listener one of the two always gets an unusable advertised
      # address back. CONTROLLER is the KRaft quorum plane - internal only, never advertised.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "29092:29092"
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.2
    restart: unless-stopped
    networks: [ uberlite ]
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  discovery-server:
    <<: *app-service
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    ports:
      - "8761:8761"
    # No depends_on at all: the registry depends on nothing, and everything else tolerates it being
    # absent for a while.

  api-gateway:
    <<: *app-service
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    depends_on: *platform

  # -----------------------------------------------------------------------------------------------
  # Databases - one per service (ARCHITECTURE.md Sec. 5, "database per service"). No profile, so a
  # service's database is always there when you start that service by name.
  # -----------------------------------------------------------------------------------------------
  trip-service-postgres:
    <<: *postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: tripdb
    ports: [ "5433:5432" ]
    volumes: [ trip-service-db-data:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U uberlite -d tripdb" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  tax-tolls-postgres:
    <<: *postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: taxtollsdb
    ports: [ "5434:5432" ]
    volumes: [ tax-tolls-db-data:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U uberlite -d taxtollsdb" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  discounts-postgres:
    <<: *postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: discountsdb
    ports: [ "5435:5432" ]
    volumes: [ discounts-db-data:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U uberlite -d discountsdb" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  forecasting-postgres:
    <<: *postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: forecastingdb
    ports: [ "5436:5432" ]
    volumes: [ forecasting-db-data:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U uberlite -d forecastingdb" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  matching-analytics-postgres:
    <<: *postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: matchinganalyticsdb
    ports: [ "5437:5432" ]
    volumes: [ matching-analytics-db-data:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U uberlite -d matchinganalyticsdb" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  discounts-analytics-postgres:
    <<: *postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: discountsanalyticsdb
    ports: [ "5438:5432" ]
    volumes: [ discounts-analytics-db-data:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U uberlite -d discountsanalyticsdb" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # -----------------------------------------------------------------------------------------------
  # Marketplace services (paper Sec. 4). Every one of these is startable on its own:
  #
  #     docker compose up -d price-estimation-service
  #
  # brings up the platform, that one JVM and nothing else. Its Feign calls to route/time/surge/tax/
  # discounts fail fast with "No instances available" until you start those too - a visible, correct
  # failure mode, and the same one its tests already cover with StubServer.
  # -----------------------------------------------------------------------------------------------
  route-service:
    <<: *app-service
    profiles: [ "all", "core" ]
    build:
      context: .
      dockerfile: route-service/Dockerfile
    ports:
      - "8087:8087"
    depends_on: *platform

  time-estimation-service:
    <<: *app-service
    profiles: [ "all", "core" ]
    build:
      context: .
      dockerfile: time-estimation-service/Dockerfile
    ports:
      - "8088:8088"
    depends_on: *platform

  driver-discovery-service:
    <<: *app-service
    profiles: [ "all", "core" ]
    build:
      context: .
      dockerfile: driver-discovery-service/Dockerfile
    ports:
      - "8086:8086"
    depends_on:
      discovery-server:
        condition: service_started
      zipkin:
        condition: service_started
      # Lettuce connects lazily on first use, so `started` is enough.
      redis:
        condition: service_started

  tax-tolls-service:
    <<: *app-service
    profiles: [ "all", "core" ]
    build:
      context: .
      dockerfile: tax-tolls-service/Dockerfile
    ports:
      - "8090:8090"
    depends_on:
      discovery-server:
        condition: service_started
      zipkin:
        condition: service_started
      # `started`, not `healthy`: a health gate is silently a no-op on runtimes that do not run
      # Compose health checks (Podman), which leaves this service unstarted rather than degraded.
      # If Postgres is still running initdb this container exits and the restart policy brings it
      # back a few seconds later, which is visible in `ps` and recovers without intervention.
      tax-tolls-postgres:
        condition: service_started

  discounts-promotions-service:
    <<: *app-service
    profiles: [ "all", "core" ]
    build:
      context: .
      dockerfile: discounts-promotions-service/Dockerfile
    ports:
      - "8091:8091"
    depends_on:
      discovery-server:
        condition: service_started
      zipkin:
        condition: service_started
      discounts-postgres:
        condition: service_started

  surge-pricing-service:
    <<: *app-service
    profiles: [ "all", "core" ]
    build:
      context: .
      dockerfile: surge-pricing-service/Dockerfile
    ports:
      - "8084:8084"
    depends_on:
      discovery-server:
        condition: service_started
      zipkin:
        condition: service_started
      redis:
        condition: service_started

  price-estimation-service:
    <<: *app-service
    profiles: [ "all", "core" ]
    build:
      context: .
      dockerfile: price-estimation-service/Dockerfile
    ports:
      - "8085:8085"
    depends_on: *platform

  matching-service:
    <<: *app-service
    profiles: [ "all", "core" ]
    build:
      context: .
      dockerfile: matching-service/Dockerfile
    ports:
      - "8089:8089"
    depends_on: *platform

  trip-service:
    <<: *app-service
    profiles: [ "all", "core" ]
    build:
      context: .
      dockerfile: trip-service/Dockerfile
    ports:
      - "8083:8083"
    depends_on:
      <<: *platform-with-kafka
      trip-service-postgres:
        condition: service_started

  # -----------------------------------------------------------------------------------------------
  # Background analytics (paper Sec. 5)
  # -----------------------------------------------------------------------------------------------
  forecasting-service:
    <<: *app-service
    profiles: [ "all", "analytics" ]
    build:
      context: .
      dockerfile: forecasting-service/Dockerfile
    ports:
      - "8092:8092"
    depends_on:
      <<: *platform-with-kafka
      forecasting-postgres:
        condition: service_started

  matching-analytics-service:
    <<: *app-service
    profiles: [ "all", "analytics" ]
    build:
      context: .
      dockerfile: matching-analytics-service/Dockerfile
    ports:
      - "8093:8093"
    depends_on:
      <<: *platform-with-kafka
      matching-analytics-postgres:
        condition: service_started

  discounts-analytics-service:
    <<: *app-service
    profiles: [ "all", "analytics" ]
    build:
      context: .
      dockerfile: discounts-analytics-service/Dockerfile
    ports:
      - "8094:8094"
    depends_on:
      # No Kafka: this is a nightly batch that pulls counts from Trip Service by service id, so
      # Eureka is required and the broker is not. Trip Service is deliberately not a dependency
      # either - a scheduled run logs a failure and tries again, it does not need a peer at boot.
      discovery-server:
        condition: service_started
      zipkin:
        condition: service_started
      discounts-analytics-postgres:
        condition: service_started

networks:
  uberlite:
    driver: bridge

volumes:
  trip-service-db-data:
  tax-tolls-db-data:
  discounts-db-data:
  forecasting-db-data:
  matching-analytics-db-data:
  discounts-analytics-db-data:

