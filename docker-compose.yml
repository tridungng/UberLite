version: '3.8'

services:
  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    ports:
      - "8761:8761"
    depends_on: []

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - discovery-server

  zookeeper:
    image: confluentinc/cp-zookeeper:8.2.2
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:8.2.2
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"

  trip-service-postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: tripdb
      POSTGRES_USER: uberlite
      POSTGRES_PASSWORD: changeme
    ports:
      - "5433:5432"
    volumes:
      - trip-service-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uberlite -d tripdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  trip-service:
    build:
      context: .
      dockerfile: trip-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8083:8083"
    depends_on:
      - trip-service-postgres
      - kafka

  driver-discovery-service:
    build:
      context: .
      dockerfile: driver-discovery-service/Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8086:8080"
    depends_on:
      - redis

  route-service:
    build:
      context: .
      dockerfile: route-service/Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8087:8080"
    depends_on:
      - redis

  time-estimation-service:
    build:
      context: .
      dockerfile: time-estimation-service/Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8088:8080"
    depends_on:
      - redis

  surge-pricing-service:
    build:
      context: .
      dockerfile: surge-pricing-service/Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8084:8084"
    depends_on:
      - redis
      - driver-discovery-service

volumes:
  trip-service-db-data:
