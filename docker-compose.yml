version: '3.8'

services:
  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    ports:
      - "8761:8761"
    depends_on: []

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - discovery-server

  zookeeper:
    image: confluentinc/cp-zookeeper:8.2.2
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:8.2.2
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"

  trip-service-postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: tripdb
      POSTGRES_USER: uberlite
      POSTGRES_PASSWORD: changeme
    ports:
      - "5433:5432"
    volumes:
      - trip-service-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uberlite -d tripdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  trip-service:
    build:
      context: .
      dockerfile: trip-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8083:8083"
    depends_on:
      - trip-service-postgres
      - kafka
      # Orchestration resolves these by service id through Eureka, so discovery must be up too.
      - discovery-server
      - price-estimation-service
      - matching-service
      - surge-pricing-service

  tax-tolls-postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: taxtollsdb
      POSTGRES_USER: uberlite
      POSTGRES_PASSWORD: changeme
    ports:
      - "5434:5432"
    volumes:
      - tax-tolls-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uberlite -d taxtollsdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  tax-tolls-service:
    build:
      context: .
      dockerfile: tax-tolls-service/Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8090:8090"
    depends_on:
      - tax-tolls-postgres

  discounts-postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: discountsdb
      POSTGRES_USER: uberlite
      POSTGRES_PASSWORD: changeme
    ports:
      - "5435:5432"
    volumes:
      - discounts-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uberlite -d discountsdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  discounts-promotions-service:
    build:
      context: .
      dockerfile: discounts-promotions-service/Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8091:8091"
    depends_on:
      - discounts-postgres

  driver-discovery-service:
    build:
      context: .
      dockerfile: driver-discovery-service/Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8086:8080"
    depends_on:
      - redis

  route-service:
    build:
      context: .
      dockerfile: route-service/Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8087:8080"
    depends_on:
      - redis

  time-estimation-service:
    build:
      context: .
      dockerfile: time-estimation-service/Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8088:8080"
    depends_on:
      - redis

  surge-pricing-service:
    build:
      context: .
      dockerfile: surge-pricing-service/Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8084:8084"
    depends_on:
      - redis
      - driver-discovery-service

  price-estimation-service:
    build:
      context: .
      dockerfile: price-estimation-service/Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8085:8085"
    depends_on:
      - discovery-server
      - route-service
      - time-estimation-service
      - surge-pricing-service
      - tax-tolls-service
      - discounts-promotions-service

  matching-service:
    build:
      context: .
      dockerfile: matching-service/Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8089:8089"
    depends_on:
      # Needs Eureka: both downstream calls are resolved by service id, not host name.
      - discovery-server
      - driver-discovery-service
      - route-service

  forecasting-postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: forecastingdb
      POSTGRES_USER: uberlite
      POSTGRES_PASSWORD: changeme
    ports:
      - "5436:5432"
    volumes:
      - forecasting-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uberlite -d forecastingdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  forecasting-service:
    build:
      context: .
      dockerfile: forecasting-service/Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8092:8092"
    depends_on:
      - forecasting-postgres
      - kafka
      - discovery-server

  matching-analytics-postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: matchinganalyticsdb
      POSTGRES_USER: uberlite
      POSTGRES_PASSWORD: changeme
    ports:
      - "5437:5432"
    volumes:
      - matching-analytics-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uberlite -d matchinganalyticsdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  matching-analytics-service:
    build:
      context: .
      dockerfile: matching-analytics-service/Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8093:8093"
    depends_on:
      - matching-analytics-postgres
      - kafka
      - discovery-server

  discounts-analytics-postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: discountsanalyticsdb
      POSTGRES_USER: uberlite
      POSTGRES_PASSWORD: changeme
    ports:
      - "5438:5432"
    volumes:
      - discounts-analytics-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uberlite -d discountsanalyticsdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  discounts-analytics-service:
    build:
      context: .
      dockerfile: discounts-analytics-service/Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8094:8094"
    depends_on:
      - discounts-analytics-postgres
      # No Kafka: this one is a nightly batch that pulls counts from Trip Service, which it
      # resolves by service id, so Eureka is required and the broker is not.
      - discovery-server
      - trip-service

volumes:
  trip-service-db-data:
  tax-tolls-db-data:
  discounts-db-data:
  forecasting-db-data:
  matching-analytics-db-data:
  discounts-analytics-db-data:
