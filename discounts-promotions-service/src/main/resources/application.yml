server:
  port: 8091

spring:
  config:
    import: "optional:classpath:uberlite-defaults.yml"
  application:
    name: discounts-promotions-service
  datasource:
    # localhost default keeps the module standalone-runnable; the docker profile below swaps in the
    # Compose hostname. Previously hardcoded to the Compose hostname with no docker profile.
    url: jdbc:postgresql://localhost:5435/discountsdb
    username: uberlite
    password: changeme
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://discounts-postgres:5432/discountsdb
