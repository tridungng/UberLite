spring:
  config:
    import: "optional:classpath:uberlite-defaults.yml"
  application:
    name: surge-pricing-service
  data:
    # `spring.redis.*` was removed in Boot 3; under that key the service silently kept the default
    # localhost:6379 and never reached the Compose Redis.
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8084

# Readiness gates traffic on the datastore this service cannot serve without. Only `readinessState`
# is in common's uberlite-defaults.yml: Actuator refuses to start when a health group names a
# contributor that does not exist, so the datastore member is declared by the module that has one.
management:
  endpoint:
    health:
      group:
        readiness:
          include:
            - readinessState
            - db

---
spring:
  config:
    activate:
      on-profile: docker
  data:
    redis:
      host: redis
