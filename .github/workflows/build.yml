name: Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build & unit/integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          # Must match <java.version> in the root pom and the Dockerfile base image tags.
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # No `services:` block any more. The integration tests bring up their own Postgres via
      # Testcontainers and their own broker via @EmbeddedKafka, so the pre-provisioned service
      # containers were unused and had drifted out of sync with what the tests connect to.
      - name: Build and test
        run: ./mvnw -B clean install

      - name: Check config consistency across yml / Dockerfile / compose / gateway routes
        run: python3 scripts/check-config-consistency.py

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'

  e2e:
    name: docker compose + demo.sh
    runs-on: ubuntu-latest
    # The point of issue 11: prove the services work *together*, not just that each one compiles.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # --wait blocks until every container reports healthy, which works because each image
      # declares a HEALTHCHECK against /actuator/health.
      - name: Bring the stack up
        run: docker compose up --build --detach --wait

      - name: Run the end-to-end demo
        run: ./scripts/demo.sh

      - name: Dump container state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
